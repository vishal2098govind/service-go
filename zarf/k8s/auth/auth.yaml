apiVersion: v1
kind: Namespace
metadata:
  name: auth

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auth
spec:
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: vishalgovind/auth
          imagePullPolicy: Never
          resources:
            limits:
              cpu: "250m"
              memory: "36Mi"
            requests:
              cpu: "250m"
              memory: "36Mi"

          livenessProbe:
            httpGet:
              path: /liveness
              port: 3001

          readinessProbe:
            httpGet:
              path: /readiness
              port: 3001

          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: auth
spec:
  selector:
    app: auth
  ports:
    - port: 3001
      protocol: TCP
      targetPort: 3001

---
