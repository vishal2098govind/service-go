apiVersion: v1
kind: Namespace
metadata:
  name: sales

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
  namespace: sales
spec:
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      containers:
        - name: sales
          image: vishalgovind/sales
          imagePullPolicy: Never
---

