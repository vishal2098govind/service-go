apiVersion: v1
kind: Namespace
metadata:
  name: sales

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
  namespace: sales
spec:
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      containers:
        - name: sales
          image: vishalgovind/sales
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "250m"
              memory: "36Mi"
            limits:
              cpu: "250m"
              memory: "36Mi"

          livenessProbe:
            httpGet:
              path: /liveness
              port: 3000

          readinessProbe:
            httpGet:
              path: /readiness
              port: 3000

          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu # this is converted to decimal and rounded off by k8s using ceil

---
apiVersion: v1
kind: Service
metadata:
  name: sales
  namespace: sales
spec:
  selector:
    app: sales
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000

---

